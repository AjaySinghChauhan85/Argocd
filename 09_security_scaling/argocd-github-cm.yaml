apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # The external URL ArgoCD is reachable at
  url: https://argocd.chaiargo.shop

  # OIDC scopes requested from GitHub via Dex
  scopes: '[groups, email]'

  # Dex configuration for GitHub SSO (org restriction removed)
  dex.config: |
    connectors:
    - type: github
      id: github
      name: GitHub
      config:
        clientID: $dex.github.clientId
        clientSecret: $dex.github.clientSecret
