apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shop-app
  namespace: default
spec:
  replicas: 5
  selector:
    matchLabels:
      app: online-shop
  template:
    metadata:
      labels:
        app: online-shop
    spec:
      containers:
        - name: online-shop-container
          image: houssemeddine/restaurant-website:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "250m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
