apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-shop-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AjaySinghChauhan85/Argocd.git
    targetRevision: argocd
    path: 04_first_app_deployment/declarative_approach/online_shop  # Path within the repo
  destination:
    server: https://172.31.39.252:33894 # Production cluster API server URL here, run `argocd cluster list` to get the URL
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    
