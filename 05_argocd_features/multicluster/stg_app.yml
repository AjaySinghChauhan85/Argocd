apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apache-stg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AjaySinghChauhan85/Argocd.git
    targetRevision: argocd
    path: 04_first_app_deployment/cli_approach/apache      # Path to apache manifests
  destination:
    server: https://172.31.39.252:33893  # from `argocd cluster list`
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
