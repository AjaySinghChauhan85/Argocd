apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AjaySinghChauhan85/Argocd.git
    targetRevision: argocd
    path: 04_first_app_deployment/ui_approach/nginx
  destination:
    server: https://172.31.34.213:33893
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
