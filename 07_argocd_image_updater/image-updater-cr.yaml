apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: chai-app-updater
  namespace: argocd
spec:
  # Configure the Git write-back method and credential secret
  writeBackConfig:
    method: "git"
    gitConfig:
      secretName: "argocd-image-updater-git-creds"

  # Match your application and nest its images directly under it
  applicationRefs:
    - namePattern: "chai-app"
      commonUpdateSettings:
        updateStrategy: "semver"
      images:
        - alias: "chai-app"
          imageName: "ajaysingh85/chai-devops"
