apiVersion: v1
kind: Service
metadata:
  name: chai-service
spec:
  type: ClusterIP   # Changed from NodePort to ClusterIP
  selector:
    app: chai-app   # Must match the label in your deployment
  ports:
    - protocol: TCP
      port: 80       # The internal port other pods use to access this service
      targetPort: 80 # The port your container is listening on
